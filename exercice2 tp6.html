<!DOCTYPE html>
<html lang="fr">
    <style>
body {
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    padding: 20px;
}

h1 {
    text-align: center;
}

form {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

input {
    padding: 10px;
    width: 250px;
    border: 1px solid #aaa;
    border-radius: 5px;
}

button {
    padding: 10px 15px;
    margin-left: 10px;
    border: none;
    background: #4caf50;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #45a049;
}

#task-list {
    list-style: none;
    padding: 0;
    max-width: 400px;
    margin: 0 auto;
}

li {
    background: white;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

li.completed {
    text-decoration: line-through;
    opacity: 0.6;
}

.task-buttons button {
    margin-left: 5px;
    cursor: pointer;
    padding: 5px 8px;
    border: none;
    border-radius: 4px;
}

.complete-btn {
    background: #2196f3;
    color: white;
}

.delete-btn {
    background: #f44336;
    color: white;
}
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>To-Do List</h1>

    <form id="task-form">
        <input type="text" id="task-input" placeholder="Nouvelle tâche..." required>
        <button type="submit">Ajouter</button>
    </form>

    <ul id="task-list"></ul>

    <script src="script.js"></script>
</body>
</html>
